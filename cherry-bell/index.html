<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cherry Bell · House Money</title>
  <meta name="description" content="Cherry Bell at House Money: an old three-reel fruit machine with cherries, lemons, oranges, plums, bells, bars and sevens on one pay line. Pull the handle. Play chips only.">
  <meta property="og:title" content="Cherry Bell · House Money">
  <meta property="og:description" content="An old three-reel fruit machine. Pull the handle.">
  <meta property="og:image" content="https://house-money.junkdrawer.works/og.png">
  <meta property="og:url" content="https://house-money.junkdrawer.works/cherry-bell/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2a1510">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icon-180.png">
  <link rel="preload" href="../fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/limelight.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../shared/casino.css">
  <link rel="stylesheet" href="css/cherry-bell.css">
</head>
<body class="table slot cherry-bell">
  <header class="bar"></header>
  <main>
    <p class="say" id="say" aria-live="polite"></p>
    <div class="stand">
      <div class="cab">
        <div class="topper"><span class="lamps" aria-hidden="true"></span><h2 class="sign">Cherry Bell</h2></div>
        <div class="glass">
          <table class="pays" id="pays" aria-label="Pay table: coins paid for each coin bet">
            <thead><tr><th scope="col"><span class="vh">Line</span></th><th scope="col" data-c="1">1 coin</th><th scope="col" data-c="2">2</th><th scope="col" data-c="3">3</th></tr></thead>
            <tbody></tbody>
          </table>
          <p class="lemons">Lemons pay nothing. Never have.</p>
        </div>
        <div class="window">
          <div class="reels" id="reelBox"><canvas id="reels" role="img" aria-label="The reels"></canvas></div>
          <span class="payline" aria-hidden="true"></span>
          <span class="lamp l1" aria-hidden="true"></span><span class="lamp l2" aria-hidden="true"></span><span class="lamp l3" aria-hidden="true"></span>
        </div>
        <div class="meters">
          <div class="meter"><span>Coins in</span><b id="coinsM">3</b></div>
          <div class="meter"><span>Bet</span><b id="betM">3</b></div>
          <div class="meter"><span>Paid</span><b id="winM">0</b></div>
        </div>
        <div class="deck">
          <div class="coinsize" id="coinSize" role="radiogroup" aria-label="Coin size"></div>
          <div class="pushes">
            <button type="button" class="push" id="betOne">Bet one</button>
            <button type="button" class="push" id="betMax">Bet max</button>
            <button type="button" class="push spin" id="spin">Spin</button>
          </div>
        </div>
      </div>
      <div class="handle" id="handle" role="button" tabindex="0" aria-label="Pull the handle">
        <span class="slotway" aria-hidden="true"></span>
        <span class="arm" aria-hidden="true"></span><span class="knob" aria-hidden="true"></span>
      </div>
    </div>
  </main>
  <noscript><p class="say">Cherry Bell needs JavaScript to spin the reels.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
