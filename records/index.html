<body class="floor records">

    <a class="back" href="../"><span aria-hidden="true">‹</span> The floor</a>

    <p id="since"></p>
    <p id="every" hidden>Counting every device that saves to Google Drive.</p>

  <main>
    <section class="totals" id="totals" aria-label="The whole floor"></section>

    <section class="ms" id="ms" aria-labelledby="msH"></section>

    <section class="over" aria-label="Start over">
      <button type="button" class="btn ghost small" id="startOver">Start over</button>
      <div class="over-ask" id="overAsk" hidden>
        <p id="overWhat"></p>

      </div>
      <p class="note" id="overDone" aria-live="polite"></p>
    </section>
  </main>
